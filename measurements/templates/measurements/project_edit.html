{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="fw-bold mb-4">
        Edycja projektu
    </h2>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            {{ form.name.label_tag }}
            {{ form.name }}
        </div>

        <div class="mb-3">
            {{ form.description.label_tag }}
            {{ form.description }}
        </div>

        <div class="d-flex gap-2">

            <button type="submit"
                    class="btn btn-primary">
                Zapisz zmiany
            </button>

            <a href="{% url 'project_detail' project.id %}"
               class="btn btn-outline-secondary">
                Anuluj
            </a>

        </div>
    </form>

</div>

{% endblock %}
